<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picker target fixture</title>
  <style>
    body{margin:0;padding:48px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#2b2723;background:#f7f5f2}
    h1{font-size:30px;margin:0 0 12px}
    p{max-width:540px;color:#6d6961}
    .card{max-width:560px;margin-top:28px;padding:18px 20px;border:1px solid #e6e1d8;border-radius:14px;background:#fff}
    #pick-target{cursor:pointer;text-decoration:underline;text-decoration-color:#d13e27;text-underline-offset:4px}
  </style>
</head>
<body>
  <h1>Picker target fixture</h1>
  <p>This page is opened as a second tab. The app asks the extension to run the element picker here; the extension UI must not mount on this page for that flow.</p>
  <div class="card">
    <h2>Documentation card</h2>
    <p>Click the target label below when the picker is active.</p>
    <p><strong id="pick-target">Pick this element</strong></p>
  </div>
</body>
</html>
