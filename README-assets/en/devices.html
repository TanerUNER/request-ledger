<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1440px;height:560px;overflow:hidden}
  body{
    position:relative;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(760px 380px at 80% 6%,rgba(255,95,67,.13),transparent 65%),
      radial-gradient(640px 400px at 10% 102%,rgba(111,129,106,.15),transparent 62%),
      #f7f5f2;
    color:#1d2328;
  }
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(30,35,40,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(30,35,40,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 92%)}
  .head{text-align:center;position:absolute;left:0;right:0;top:34px}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#c14930;margin-bottom:7px}
  h2{margin:0;font-size:40px;letter-spacing:-.045em;line-height:1.05;font-weight:760}
  .head p{margin:9px 0 0;font-size:13px;color:#6a726f}
  .devices{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:60px}
  .unit{display:flex;flex-direction:column;align-items:center;gap:12px}
  .monitor .frame{background:#1c242b;border-radius:15px;padding:8px 8px 0;box-shadow:0 20px 34px rgba(32,28,20,.18)}
  .monitor .screen{width:392px;height:245px;border-radius:7px;overflow:hidden;background:#fff}
  .monitor .stand{width:70px;height:32px;margin:0 auto;background:linear-gradient(180deg,#2b353d,#1b2228)}
  .monitor .base{width:178px;height:9px;margin:0 auto 0;border-radius:0 0 9px 9px;background:linear-gradient(180deg,#303b44,#171d22)}
  .laptop .frame{background:#1a2228;border-radius:10px 10px 3px 3px;padding:7px 7px 9px;box-shadow:0 20px 34px rgba(32,28,20,.18)}
  .laptop .screen{width:350px;height:206px;border-radius:4px;overflow:hidden;background:#fff}
  .laptop .base{width:388px;height:12px;margin-left:-19px;border-radius:2px 2px 9px 9px;background:linear-gradient(180deg,#2c363e,#151b20)}
  .tablet .frame{background:#1c242b;border-radius:20px;padding:8px;box-shadow:0 20px 34px rgba(32,28,20,.18)}
  .tablet .screen{width:282px;height:214px;border-radius:13px;overflow:hidden;background:#fff}
  img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
  .caption{text-align:center}
  .caption b{display:block;font-size:11.5px;letter-spacing:.02em;color:#2b3237}
  .caption span{display:block;margin-top:2px;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#919793}
  .shadowline{position:absolute;left:120px;right:120px;bottom:66px;height:1px;background:linear-gradient(90deg,transparent,rgba(40,45,40,.14),transparent)}
  .pill{position:absolute;right:38px;top:38px;display:flex;align-items:center;gap:7px;border:1px solid rgba(30,35,40,.12);background:rgba(255,255,255,.66);border-radius:999px;padding:7px 11px;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#56605c}
  .pill i{width:6px;height:6px;border-radius:50%;background:#6f816a;box-shadow:0 0 0 3px rgba(111,129,106,.14)}
</style>
</head>
<body>
<div class="grid"></div>
<div class="head">
  <div class="eyebrow">Responsive by design</div>
  <h2>Every screen, same flow.</h2>
  <p>Desktop, laptop and tablet layouts are part of the release. Mobile is intentionally out of scope.</p>
</div>
<div class="pill"><i></i> 1024 px → 1440 px</div>

<div class="devices">
  <div class="unit monitor">
    <div class="frame"><div class="screen"><img src="screens/01-dashboard-desktop.png" alt="Desktop at 1440 px"></div></div>
    <div class="stand"></div><div class="base"></div>
    <div class="caption"><b>Desktop</b><span>1440 px</span></div>
  </div>
  <div class="unit laptop">
    <div class="frame"><div class="screen"><img src="screens/02-dashboard-laptop.png" alt="Laptop at 1280 px"></div></div>
    <div class="base"></div>
    <div class="caption"><b>Laptop</b><span>1280 px</span></div>
  </div>
  <div class="unit tablet">
    <div class="frame"><div class="screen"><img src="screens/03-dashboard-tablet.png" alt="Tablet at 1024 px"></div></div>
    <div class="caption"><b>Tablet</b><span>1024 px</span></div>
  </div>
</div>
<div class="shadowline"></div>
</body>
</html>
